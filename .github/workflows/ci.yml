name: EurekaVault CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Lint TypeScript and React
        run: npm run lint

      - name: Run Vitest suite
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Validate Netlify Function syntax
        shell: bash
        run: |
          set -euo pipefail
          for function_file in netlify/functions/*.mjs; do
            node --check "$function_file"
          done

  backend-tests:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Spring Boot backend
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

  backend-container:
    name: Backend Docker build and runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build the Render-equivalent Docker image
        run: docker build --tag eurekavault-backend-ci --file backend/Dockerfile backend

      - name: Start container
        run: docker run --detach --rm --name eurekavault-backend-ci --publish 18080:8080 eurekavault-backend-ci

      - name: Wait for Spring Boot health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health 2>/dev/null)"; then
              echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
              exit 0
            fi
            sleep 2
          done
          docker logs eurekavault-backend-ci
          exit 1

      - name: Verify unexposed actuator endpoint stays unavailable
        shell: bash
        run: |
          status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/actuator/env)"
          test "$status_code" = "404"

      - name: Print container logs on failure
        if: failure()
        run: docker logs eurekavault-backend-ci || true

      - name: Stop container
        if: always()
        run: docker stop eurekavault-backend-ci || true
