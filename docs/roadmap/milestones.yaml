- id: prompt-blocks-mvp
  name: Prompt Blocks MVP
  status: completed
  status_basis: 2026-08-19-delivery-working-tree
  objective: Create the first reusable, persisted executable Prompt-processing methodology graph using typed blocks, named variables, explicit constraints and deterministic DAG-style AI transformations.
  issues:
  - 7
  dependencies:
  - versioned-prompt-workspace
  - ai-prompt-intelligence
  start_date:
    value: '2026-08-19'
    type: delivery_fact
    confidence: high
  target_date:
    value: '2026-08-19'
    type: delivery_fact
    confidence: high
    window_start: '2026-08-19'
    window_end: '2026-08-19'
  estimated_duration: Implemented as the 2026-08-19 delivery; historical forecast superseded.
  progress:
    value: 100
    type: implementation_delivery
    confidence: high
    basis: Typed graph model, Firebase persistence, desktop/mobile workspace, authenticated per-block Gemini execution, intermediate inspection, branching outputs, lifecycle integration and focused tests are present in the delivery working tree.
  definition_of_done:
  - Pipeline artifact/domain model is persisted and supports create/update/archive/restore/delete.
  - Named variables and typed Prompt/constraint dependencies compose into a readable deterministic DAG.
  - Visual desktop builder supports add/move/configure/connect/disconnect/delete operations; mobile uses an ordered workflow editor rather than a scaled canvas.
  - Existing Prompt references support current-version and pinned-version semantics.
  - Validation/topological ordering happens before execution and cycles are rejected.
  - Gemini execution uses the authenticated Netlify boundary and preserves intermediate outputs/errors for inspection.
  - Constraints include real Mindset references and extracted-style runtime constraints with explicit stored priority.
  - Transformation prompts are viewable/editable Firebase records seeded only when missing from thorough defaults.
  - Running a pipeline never mutates source Prompt data; explicit output save reuses normal Prompt/version lifecycle.
  - Saved definitions and transform-prompt configuration participate in Global Version snapshots/export; runtime values do not.
  - Dedicated pipeline-local automatic history, loops, conditional routing and typed non-text variables are explicitly outside this MVP.
