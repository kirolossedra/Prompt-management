spring:
  application:
    name: eurekavault-backend

server:
  port: ${PORT:8080}
  shutdown: graceful

firebase:
  admin:
    enabled: ${FIREBASE_ADMIN_ENABLED:false}
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
