<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">EurekaVault weekly commit count</title>
  <desc id="desc">23 commits from August 3 to 9, zero from August 10 to 16, and 19 from August 17 through the August 20 snapshot.</desc>
  <rect width="900" height="360" fill="white"/>
  <text x="48" y="42" font-family="sans-serif" font-size="22" font-weight="700" fill="#111">Weekly Git commit count</text>
  <text x="48" y="68" font-family="sans-serif" font-size="13" fill="#555">Historical activity only — not a productivity target or forecast</text>
  <line x1="70" y1="290" x2="850" y2="290" stroke="#999"/>
  <line x1="70" y1="100" x2="70" y2="290" stroke="#999"/>
  <rect x="140" y="106" width="130" height="184" rx="5" fill="#444"/>
  <rect x="385" y="290" width="130" height="0" rx="5" fill="#777"/>
  <rect x="630" y="138" width="130" height="152" rx="5" fill="#555"/>
  <text x="205" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#111">23</text>
  <text x="450" y="278" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#111">0</text>
  <text x="695" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#111">19*</text>
  <text x="205" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Aug 3–9</text>
  <text x="450" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Aug 10–16</text>
  <text x="695" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Aug 17–23*</text>
  <text x="695" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">*partial through Aug 20 UTC</text>
</svg>
