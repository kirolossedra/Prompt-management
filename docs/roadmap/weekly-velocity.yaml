analysis_cutoff: '2026-08-18T12:39:00-04:00'
week_definition:
  calendar: Monday-Sunday in America/Toronto
  reason: Preserves inactive calendar weeks and makes Week N → Week N+1 comparisons repeatable. Week 1 is a partial project
    week because the repository began on Thursday 2026-08-06.
index_methodology:
  engineering_activity_index: 0-100 relative to the highest observed project week. Considers meaningful commit count, breadth/churn,
    active development days, tests/infrastructure and corrective/refactor work. Raw commit count alone is not the score.
  feature_delivery_index: 0-100 relative to the highest observed week. Weights newly usable user-facing capabilities and material
    workflow improvements, not line count.
  architecture_delivery_index: 0-100 relative to the highest observed week. Weights platform/data/security/runtime boundaries,
    structural refactors, tests and enabling architecture.
  issue_completion_index: 0-100 progress against explicitly tracked GitHub Issues. Weeks before issue tracking existed remain
    0/not-applicable rather than receiving invented historical issue completion.
  overall_product_delivery: round(0.20*engineering + 0.45*feature + 0.35*architecture). It is a weekly delivery/velocity score,
    not cumulative product completeness.
  normalization_note: Week 1 is the observed peak and therefore anchors 100. These scores are an evidence-based heuristic,
    not story points and not percentages of the final product.
