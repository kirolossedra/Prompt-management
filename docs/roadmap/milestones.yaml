- id: prompt-blocks-mvp
  name: Prompt Blocks MVP
  status: planned
  status_basis: issue_7_confirmed_scope
  objective: Create the first reusable, persisted and version-controlled executable methodology graph
    using named variables and deterministic DAG-style AI transformations.
  issues:
  - 7
  dependencies:
  - versioned-prompt-workspace
  - ai-prompt-intelligence
  start_date:
    value: '2026-11-02'
    type: estimated
    confidence: low
  target_date:
    value: '2026-12-20'
    type: estimated
    confidence: low
    window_start: '2026-11-02'
    window_end: '2026-12-20'
  estimated_duration: '6-7+ weeks; Issue #7 must be decomposed before a trustworthy target can exist'
  progress:
    value: 0
    type: repository_evidence
    confidence: high
    basis: Code search found no Prompt Blocks/workflow implementation at snapshot.
  definition_of_done:
  - Workflow artifact/domain model is persisted and supports CRUD plus archive/restore.
  - Named variables and Prompt dependencies can be composed as readable DAGs such as X + Y → Z.
  - Visual builder supports create/move/configure/connect/disconnect/duplicate/delete operations.
  - Existing Prompt references support current-version and pinned-version semantics.
  - Execution preview produces a deterministic dependency order before any AI call.
  - Gemini execution uses authenticated server-side boundary and preserves intermediate outputs/errors
    for inspection.
  - Workflow history/versioning records methodology evolution and dependency versions used for runs.
  - Loops/conditional routing and typed non-text variables are explicitly outside MVP unless separately
    approved.
